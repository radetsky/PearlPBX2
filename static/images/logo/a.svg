      <stop offset="0%"  stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F5F5F7" />
      <stop offset="65%" stop-color="#D9DADE" />
      <stop offset="78%" stop-color="#C5C7CE" />
      <stop offset="90%" stop-color="#B0B3BC" />
