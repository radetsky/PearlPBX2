<?xml version="1.0" encoding="UTF-8"?>
<svg width="1920" height="1080" viewBox="0 0 1920 1080"
     xmlns="http://www.w3.org/2000/svg" version="1.1">
  <!-- Simple pearl-like circle with one radial gradient -->
