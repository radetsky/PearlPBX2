;
; features.conf — consolidated configuration based on prior discussion
; Blind/Attended transfer, pickup, automixmon, parkcall, disconnect
;

[general]

; --- Basic timing ---
transferdigittimeout => 4      ; time to wait between digits when dialing a transfer destination
featuredigittimeout = 1000     ; max time (ms) between DTMF digits for feature activation

; --- Transfer sounds ---
xfersound = beep               ; played on a successful attended transfer
xferfailsound = beeperr        ; played on a failed transfer
transferannouncesound = beep   ; signals the start of the transfer process
transferretrysound = beep      ; played when dialing a valid extension fails
transferinvalidsound = beeperr ; played when dialing fails and retries are exhausted
transferdialattempts = 3       ; number of attempts to dial a valid extension during transfer

; --- Attended transfer: behavior and timeouts ---
atxfernoanswertimeout = 20     ; how long to wait for the attended transfer target to answer
atxferdropcall = no            ; no = call back the transferer if the target doesn't answer
atxfercallbackretries = 2      ; number of attempts to call back the transferer
atxferloopdelay = 10           ; delay (sec) between callback retry attempts

; --- DTMF control codes during attended transfer ---
atxferabort = *1                ; cancel the attended transfer, return to the original call
atxfercomplete = *2             ; complete the transfer and drop out of the call
atxferthreeway = *3             ; turn the call into a 3-way conference, staying on the line
atxferswap = *4                 ; swap between the two parties during an attended transfer

; --- Pickup (call pickup) ---
pickupexten = *8                ; pickup code (group pickup, via pickup_group/named_pickup_group in pjsip.conf)
pickupsound = beep              ; played on a successful pickup
pickupfailsound = beeperr       ; played on a failed pickup

; --- MixMonitor recording failure ---
recordingfailsound = beeperr    ; played if the one-touch MixMonitor feature failed to apply


[featuremap]
; IMPORTANT: these features only work when the corresponding T/t, H/h, K/k, X/x
; options are set in Dial()/Queue(), e.g.: Dial(PJSIP/${EXTEN},20,tTkKxX);

blindxfer => #1                 ; Blind transfer (requires T and/or t in Dial()/Queue())
atxfer => #2                    ; Attended transfer (requires T and/or t)
;parkcall => #72                 ; Park the call with one keypress (requires K and/or k)
;disconnect => *0                ; Hang up the call (requires H and/or h)
;automixmon => *3                ; One-touch call recording / MixMonitor (requires X and/or x)


[applicationmap]
