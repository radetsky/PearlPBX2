services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: test_pearlpbx2
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_pearlpbx2"]
      interval: 5s
      timeout: 3s
      retries: 3
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - DB_HOST=postgres-test
      - DB_PORT=5432
      - DB_NAME=test_pearlpbx2
      - DB_USER=test_user
      - DB_PASS=test_pass
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      - DJANGO_SECRET_KEY=test-secret-key-for-testing-only
      - DEVMODE=without_asterisk_on_localhost
    volumes:
      - .:/app
      - /app/.python-venv
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
