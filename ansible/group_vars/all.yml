pearlpbx2_install_dir: /usr/local/PearlPBX2
pearlpbx2_etc_dir: /etc/PearlPBX
pearlpbx2_secrets_dir: /etc/PearlPBX/.secrets
pearlpbx2_user: asterisk
pearlpbx2_group: asterisk

asterisk_version: "22-current"
asterisk_src_dir: /usr/src

db_name: pearlpbx2
db_user: pearlpbx2

ssl_dir: /etc/ssl/pearlpbx2
ssl_days: 3650

tftp_dir: /var/lib/tftpboot

# Number of past deployments kept in the rollback ledger (see update.yml /
# rollback.yml). Each entry is a few hundred bytes; 10 is ample headroom
# without letting /var/backups/pearlpbx2 grow unbounded.
deploy_history_retention: 10

# Comma-separated recipients of the nightly longest-calls email report.
# Empty disables the report and its cron job.
pearlpbx2_mail_report_recipients: ""
