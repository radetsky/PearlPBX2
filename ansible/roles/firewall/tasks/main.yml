---
- name: Install nftables
  apt:
    name: nftables
    state: present
    update_cache: yes

- name: Detect effective SSH port
  # sshd -T dumps sshd's own resolved configuration (respects Include
  # directives such as /etc/ssh/sshd_config.d/*.conf, which a plain grep/awk
  # over sshd_config would miss on most current Debian/Ubuntu images) —
  # this is the same value sshd itself will actually bind to.
  shell: sshd -T | awk '/^port /{print $2; exit}'
  register: sshd_port_result
  changed_when: false
  failed_when: false

- name: Set SSH port fact
  set_fact:
    ssh_port: "{{ sshd_port_result.stdout | trim if sshd_port_result.stdout | trim else '22' }}"

- name: Show detected SSH port before applying firewall
  debug:
    msg: "FIREWALL: SSH port detected as {{ ssh_port }} — this port will be opened in nftables rules."

- name: Deploy nftables ruleset
  template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    mode: '0644'
    validate: nft -c -f %s

- name: Enable and start nftables
  service:
    name: nftables
    state: started
    enabled: yes

- name: Reload nftables rules
  command: nft -f /etc/nftables.conf
  changed_when: false
