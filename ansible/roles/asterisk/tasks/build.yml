---
# Shared by the asterisk role's install path (tasks/main.yml, only when
# /usr/sbin/asterisk is missing) and the asterisk_update role (always, since
# an upgrade must build the new version regardless of what's installed).
# Stops right before "make install" — the caller decides when to install.

- name: Install Asterisk build dependencies
  apt:
    name:
      - pkg-config
      - build-essential
      - libedit-dev
      - uuid-dev
      - libxml2-dev
      - libsqlite3-dev
      - libspandsp-dev
      - libpq-dev
      - postgresql-client
      - libnewt-dev
      - libssl-dev
      - subversion
      - libspeex-dev
      - libspeexdsp-dev
      - libogg-dev
      - libvorbis-dev
      - libasound2-dev
      - portaudio19-dev
      - libcurl4-openssl-dev
      - xmlstarlet
      - bison
      - flex
      - unixodbc-dev
      - libneon27-dev
      - libgmime-3.0-dev
      - liblua5.2-dev
      - liburiparser-dev
      - libxslt1-dev
      - freetds-dev
      - libosptk-dev
      - libjack-jackd2-dev
      - libcap-dev
      - libsnmp-dev
      - libiksemel-dev
      - libcorosync-common-dev
      - libcpg-dev
      - libcfg-dev
      - libpopt-dev
      - libical-dev
      - libresample1-dev
      - binutils-dev
      - libsrtp2-dev
      - libgsm1-dev
      - zlib1g-dev
      - libldap2-dev
      - libcodec2-dev
      - libfftw3-dev
      - libsndfile1-dev
      - libunbound-dev
      - libopus-dev
    state: present
    update_cache: yes

- name: Download Asterisk source
  get_url:
    url: "{{ asterisk_download_url }}"
    dest: "{{ asterisk_src_dir }}/asterisk-{{ asterisk_version }}.tar.gz"
    mode: '0644'

- name: Extract Asterisk source
  unarchive:
    src: "{{ asterisk_src_dir }}/asterisk-{{ asterisk_version }}.tar.gz"
    dest: "{{ asterisk_src_dir }}"
    remote_src: yes

- name: Set Asterisk source path fact
  # The tarball always extracts to exactly this name — no need to glob for
  # it (a glob previously picked files[0] out of an unsorted list, which
  # could resolve to the wrong version when two source trees coexist).
  set_fact:
    asterisk_build_dir: "{{ asterisk_src_dir }}/asterisk-{{ asterisk_version }}"

- name: Download MP3 source
  command: ./contrib/scripts/get_mp3_source.sh
  args:
    chdir: "{{ asterisk_build_dir }}"

- name: Configure Asterisk
  command: "./configure {{ asterisk_configure_flags | join(' ') }}"
  args:
    chdir: "{{ asterisk_build_dir }}"

- name: Generate menuselect options
  command: make menuselect.makeopts
  args:
    chdir: "{{ asterisk_build_dir }}"

- name: Enable extra modules in menuselect
  # One invocation for all of them — menuselect reads and rewrites the whole
  # makeopts file on every call, so looping per-module would mean one full
  # file read/write pass per entry instead of one pass total.
  command: >-
    ./menuselect/menuselect
    {{ asterisk_menuselect_enable | map('regex_replace', '^(.*)$', '--enable \\1') | join(' ') }}
    menuselect.makeopts
  args:
    chdir: "{{ asterisk_build_dir }}"

- name: Compile Asterisk
  command: make -j{{ ansible_processor_vcpus | default(2) }}
  args:
    chdir: "{{ asterisk_build_dir }}"
