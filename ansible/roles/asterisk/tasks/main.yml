---
- name: Check if Asterisk is already installed
  stat:
    path: /usr/sbin/asterisk
  register: asterisk_binary

- name: Build and install Asterisk from source
  when: not asterisk_binary.stat.exists
  block:
    - name: Build Asterisk
      include_tasks: build.yml

    - name: Install Asterisk
      command: make install
      args:
        chdir: "{{ asterisk_build_dir }}"

    - name: Pre-seed /etc/asterisk with PearlPBX2 baseline configs
      # Must run before "make basic-pbx": that target only skips files that
      # already exist, so seeding our own queues.conf/extensions.conf/etc.
      # here stops Asterisk's demo configs (fake queues, fake agents) from
      # ever being installed instead of PearlPBX2's own baseline.
      copy:
        src: "{{ playbook_dir }}/../contrib/configs/"
        dest: /etc/asterisk/
        owner: "{{ pearlpbx2_user }}"
        group: "{{ pearlpbx2_group }}"
        mode: '0640'
        force: no

    - name: Install basic-pbx sample configs
      command: make basic-pbx
      args:
        chdir: "{{ asterisk_build_dir }}"

- name: Install asterisk log rotation script
  copy:
    src: "{{ playbook_dir }}/../bin/asterisk_logrotate.sh"
    dest: /etc/cron.daily/asterisk_logrotate
    owner: root
    group: root
    mode: '0755'

- name: Set ownership and permissions on Asterisk dirs
  include_tasks: permissions.yml
