services:
  django:
    build: .
    container_name: pearlpbx2-django
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pearlpbx2}
      - DB_USER=${DB_USER:-pearlpbx2}
      - DB_PASS=${DB_PASS:-pearlpbx2}
      - REDIS_URL=redis://redis:6379
      - ASTERISK_MANAGER_HOST=asterisk
      - ASTERISK_MANAGER_PORT=5038
      - ASTERISK_MANAGER_USERNAME=${ASTERISK_MANAGER_USERNAME:-admin}
      - ASTERISK_MANAGER_SECRET=${ASTERISK_MANAGER_SECRET:-admin}
      - ASTERISK_MANAGER_BIND=0.0.0.0
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-change-me-in-production}
      - DEVMODE=${DEVMODE:-Development}
      - PEARLPBX2_DOCKER=1
      - ALLOWED_HOSTS=localhost,127.0.0.1,django
      - ASTERISK_CONFIG_DIR=/etc/asterisk
      - ASTERISK_ROOT_DIR=/
      - ASTERISK_BACKUP_DIR=/var/spool/asterisk/backup
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      # The andrius/asterisk:22 image declares /var/lib/asterisk/sounds as its
      # own VOLUME, which shadows this subpath from the broader asterisk_lib
      # mount above with a separate anonymous volume inside the asterisk
      # container — so sound files written here were invisible to Asterisk.
      # Mounting a named volume at the exact same subpath takes it back over.
      - asterisk_sounds:/var/lib/asterisk/sounds
      - asterisk_spool:/var/spool/asterisk
    restart: unless-stopped
    networks:
      - pearlpbx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      asterisk:
        condition: service_healthy

  # Seeds Asterisk config that must exist before its first boot into the
  # shared config volume — see docker/asterisk-bootstrap.sh:
  #  - manager.conf (AMI enabled): the upstream image ships AMI disabled,
  #    and nothing else can reach Asterisk's CLI to enable it from another
  #    container. No-op once manager.conf exists (including after Django's
  #    first "Apply Changes").
  #  - modules.conf (res_crypto.so): the image's own healthcheck.sh
  #    requires this module, but the image's own default modules.conf
  #    doesn't load it. No-op once already patched.
  #  - core sounds (asterisk-core-sounds-en-gsm): the image ships with an
  #    empty /var/lib/asterisk/sounds, no standard prompts at all. No-op
  #    once already downloaded.
  asterisk-init:
    image: alpine:3.20
    container_name: pearlpbx2-asterisk-init
    environment:
      - ASTERISK_MANAGER_PORT=5038
      - ASTERISK_MANAGER_BIND=0.0.0.0
      - ASTERISK_MANAGER_USERNAME=${ASTERISK_MANAGER_USERNAME:-admin}
      - ASTERISK_MANAGER_SECRET=${ASTERISK_MANAGER_SECRET:-admin}
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_sounds:/var/lib/asterisk/sounds
      - ./docker/asterisk-bootstrap.sh:/asterisk-bootstrap.sh:ro
    command: ["sh", "/asterisk-bootstrap.sh"]
    networks:
      - pearlpbx

  asterisk:
    image: andrius/asterisk:22
    container_name: pearlpbx2-asterisk
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "10000-10099:10000-10099/udp"
      - "8088:8088/tcp"
    volumes:
      - asterisk_config:/etc/asterisk
      - asterisk_lib:/var/lib/asterisk
      - asterisk_sounds:/var/lib/asterisk/sounds
      - asterisk_spool:/var/spool/asterisk
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show channels count"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - pearlpbx
    depends_on:
      postgres:
        condition: service_healthy
      asterisk-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:17
    container_name: pearlpbx2-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-pearlpbx2}
      POSTGRES_USER: ${DB_USER:-pearlpbx2}
      POSTGRES_PASSWORD: ${DB_PASS:-pearlpbx2}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pearlpbx2} -d ${DB_NAME:-pearlpbx2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pearlpbx

  redis:
    image: redis:7-alpine
    container_name: pearlpbx2-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pearlpbx

  fastagi:
    build: services/fastagi
    container_name: pearlpbx2-fastagi
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pearlpbx2}
      - DB_USER=${DB_USER:-pearlpbx2}
      - DB_PASS=${DB_PASS:-pearlpbx2}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AMI_HOST=asterisk
      - AMI_PORT=5038
      - AMI_USER=${ASTERISK_MANAGER_USERNAME:-admin}
      - AMI_PASS=${ASTERISK_MANAGER_SECRET:-admin}
      - PARKING_ULINE_MIN=${PARKING_ULINE_MIN:-1}
      - PARKING_ULINE_MAX=${PARKING_ULINE_MAX:-199}
    restart: unless-stopped
    networks:
      - pearlpbx
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard-listener:
    build: services/dashboard
    container_name: pearlpbx2-dashboard-listener
    environment:
      - AMI_HOST=asterisk
      - AMI_PORT=5038
      - AMI_USER=${ASTERISK_MANAGER_USERNAME:-admin}
      - AMI_PASS=${ASTERISK_MANAGER_SECRET:-admin}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    networks:
      - pearlpbx
    depends_on:
      redis:
        condition: service_healthy
      asterisk:
        condition: service_started

  callback-service:
    build: services/callback
    container_name: pearlpbx2-callback
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-pearlpbx2}
      - DB_USER=${DB_USER:-pearlpbx2}
      - DB_PASS=${DB_PASS:-pearlpbx2}
      - AMI_HOST=asterisk
      - AMI_PORT=5038
      - AMI_USER=${ASTERISK_MANAGER_USERNAME:-admin}
      - AMI_PASS=${ASTERISK_MANAGER_SECRET:-admin}
    restart: unless-stopped
    networks:
      - pearlpbx
    depends_on:
      postgres:
        condition: service_healthy
      asterisk:
        condition: service_started
    profiles:
      - callback

networks:
  pearlpbx:
    name: pearlpbx
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  asterisk_config:
  asterisk_lib:
  asterisk_sounds:
  asterisk_spool:
