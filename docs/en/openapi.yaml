          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Blacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Blacklist'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
