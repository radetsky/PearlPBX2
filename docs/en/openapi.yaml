          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomListName'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomListName'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
