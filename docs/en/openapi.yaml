          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - interface
      - modified_at
      - modified_by
      - queue
      - queue_name
    QueueMemberList:
      type: object
      description: Response shape of GET /api/v1/queues/members/.
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/QueueMemberStatus'
      required:
      - members
    QueueMemberPause:
      type: object
      properties:
        interface:
          type: string
          description: Queue member interface, e.g. 'PJSIP/101'.
          maxLength: 128
        paused:
          type: boolean
          description: True to pause, false to unpause.
        queue:
          type: string
          description: Limit the pause/unpause to one queue. Omitted, it applies to
            the member in every queue it belongs to.
          maxLength: 64
      required:
      - interface
      - paused
    QueueMemberStatus:
      type: object
      description: Read-only shape of a queue member returned by the members list
        endpoint.
      properties:
        queue:
          type: string
        name:
          type: string
        location:
          type: string
        state_interface:
          type: string
        membership:
          type: string
        penalty:
          type: integer
        calls_taken:
          type: integer
        last_call:
          type: integer
        in_call:
          type: boolean
        status:
          type: string
          description: Raw AMI device status code.
        paused:
          type: boolean
      required:
      - calls_taken
      - in_call
      - last_call
      - location
      - membership
      - name
      - paused
      - penalty
      - queue
      - state_interface
      - status
    RoutingRecord:
      type: object
      description: |-
        A prefix-based routing rule within a `RoutingTable`
        (core.conf.make_routing_tables() emits one `goto` per record, sorted by
        Asterisk pattern specificity).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Routing Record Name
          description: Name of the routing record
          maxLength: 64
        prefix:
          type: string
          title: Routing Record Prefix
          description: Prefix of the routing record
          maxLength: 64
        context:
          type: integer
          title: Routing Record Context
          description: Context for the routing record
        context_name:
          type: string
          readOnly: true
        routing_table:
          type: integer
          description: Routing table for the routing record
        routing_table_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - context
      - context_name
      - created_at
      - created_by
      - id
      - modified_at
      - modified_by
      - name
      - prefix
      - routing_table
      - routing_table_name
    RoutingTable:
      type: object
      description: |-
        A routing table. Its name is both a PJSIP `context=` value and an AEL
        dialplan context name (core.conf.make_routing_tables()), so it shares a
        naming namespace with DialplanContext.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Routing table name
          description: Unique name for the routing table and dialplan context, use
            latin symbols, digits and underscores
          maxLength: 80
        routing_records_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - modified_at
      - modified_by
      - name
      - routing_records_count
    SIPPeer:
      type: object
      description: |-
        A SIP trunk/uplink. Saving here only updates the database — changes
        reach Asterisk after a superuser runs "Apply Changes" in the admin.

        `secret`/`md5_cred` are `null` in the list response — see them via GET
        on the detail route, or in the create/update response.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 32
        description:
          type: string
          description: Describe a peer
          maxLength: 64
        username:
          type: string
          nullable: true
          description: Username for the connection used for remote side
          maxLength: 32
        contact_user:
          type: string
          nullable: true
          description: Contact user for registration (overrides username if set, e.g.
            the part after / in user:pass@host/contact_user)
          maxLength: 64
        auth_type:
          nullable: true
          description: |-
            Type of authentication

            * `userpass` - Plaintext
            * `md5` - MD5
          oneOf:
          - $ref: '#/components/schemas/AuthTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        secret:
          type: string
          title: Password
          description: Clear text password for the connection used for remote side
          maxLength: 32
        transport:
          type: integer
        transport_name:
          type: string
          readOnly: true
        routing_table:
          type: integer
        routing_table_name:
          type: string
          readOnly: true
        registration_uri:
          type: string
          nullable: true
          title: Registration URI host[:port]
          description: Host[:port] of the registration server (e.g. reg.provider.com:5060)
          maxLength: 256
        contact_uri:
          type: string
          nullable: true
          title: Contact URI host[:port]
          description: Host[:port] for AOR contact (e.g. sbc.provider.com:5061)
          maxLength: 256
        match_hosts:
          type: string
          nullable: true
          description: Comma-separated list of hosts or IPs without ports (e.g. proxy1.provider.com,
            192.0.2.1)
          maxLength: 512
        registration_here:
          type: boolean
        registration_there:
          type: boolean
        nat:
          type: boolean
          description: Enable NAT traversal for this peer
        custom_auth_settings:
          type: string
          nullable: true
          title: Auth Settings
          description: Custom peer [auth] section
        custom_aor_settings:
          type: string
          nullable: true
          title: AOR Settings
          description: Custom peer [aor] section
        custom_identify_settings:
          type: string
          nullable: true
          title: Identify Settings
          description: 'Custom peer [identify] section body (after endpoint=), e.g.
            match_header=Contact: 0001'
        auth_realm:
          type: string
          readOnly: true
        md5_cred:
          type: string
          readOnly: true
        trunk_groups:
          type: array
          items:
            type: string
            title: Trunk Group Name
            description: Name of the trunk group
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - auth_realm
      - created_at
      - created_by
      - id
      - md5_cred
      - modified_at
      - modified_by
      - name
      - routing_table
      - routing_table_name
      - transport
      - transport_name
      - trunk_groups
    SIPTransport:
      type: object
      description: |-
        A PJSIP transport. Saving here only updates the database — changes reach
        Asterisk after a superuser runs "Apply Changes" in the admin.

        `cert_file`/`priv_key_file`/`ca_list_file` hold PEM contents, not paths —
        they are written to disk under the Asterisk certificate directory only
        when "Apply Changes" runs, and only for `protocol="tls"`.

        `priv_key_file` is `null` in the list response — see it via GET on the
        detail route, or in the create/update response.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: 'Example: transport-udp-nat'
          maxLength: 32
        description:
          type: string
          description: 'Example: UDP + NAT for remote users'
          maxLength: 64
        protocol:
          $ref: '#/components/schemas/ProtocolEnum'
        bind:
          type: string
          maxLength: 256
        local_nets:
          type: string
          nullable: true
          description: Comma-separated CIDR networks, e.g. '10.0.0.0/16, 192.168.0.0/24'.
          maxLength: 256
        external_media_address:
          type: string
          nullable: true
          title: External RTP IP address
          description: This is the external IP address to use in RTP handling
        external_signaling_address:
          type: string
          nullable: true
          title: External SIP IP address
          description: This is much like the external_media_address setting, but for
            SIP signaling instead of RTP media.
        method:
          $ref: '#/components/schemas/MethodEnum'
        verify_server:
          type: boolean
          title: Verify server certificate
          description: Require and verify the server TLS certificate (verify_server=yes)
        allow_reload:
          type: boolean
          description: Allow transport to be reloaded (allow_reload=yes)
        cert_file:
          type: string
        priv_key_file:
          type: string
        ca_list_file:
          type: string
        has_tls_material:
          type: boolean
          readOnly: true
        sip_users_count:
          type: integer
          readOnly: true
          default: 0
        sip_peers_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - has_tls_material
      - id
      - modified_at
      - modified_by
      - sip_peers_count
      - sip_users_count
    SIPUser:
      type: object
      description: |-
        A SIP extension. Saving here only updates the database — changes reach
        Asterisk after a superuser runs "Apply Changes" in the admin.

        `secret`/`md5_cred` are `null` in the list response — see them via GET
        on the detail route, or in the create/update response.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 64
        username:
          type: string
          maxLength: 32
        secret:
          type: string
          title: Password
          description: Password for the connection
          maxLength: 32
        transport:
          type: integer
        transport_name:
          type: string
          readOnly: true
        nat:
          type: boolean
          description: Enable NAT traversal for this peer
        extension:
          type: string
          maxLength: 32
        routing_table:
          type: integer
        routing_table_name:
          type: string
          readOnly: true
        auth_type:
          nullable: true
          description: |-
            Type of authentication

            * `userpass` - Plaintext
            * `md5` - MD5
          oneOf:
          - $ref: '#/components/schemas/AuthTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        custom_extension:
          type: string
          nullable: true
          title: Extension Settings
          description: Custom user extension section for incoming calls
        custom_settings:
          type: string
          nullable: true
          title: Settings
          description: Custom user settings
        custom_auth_settings:
          type: string
          nullable: true
          title: Auth Settings
          description: Custom user [auth] section
        custom_aor_settings:
          type: string
          nullable: true
          title: AOR Settings
          description: Custom user [aor] section
        pjsip_endpoint:
          type: string
          readOnly: true
        is_webrtc:
          type: boolean
          nullable: true
          readOnly: true
        realm:
          type: string
          nullable: true
          readOnly: true
        md5_cred:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - extension
      - id
      - is_webrtc
      - md5_cred
      - modified_at
      - modified_by
      - name
      - pjsip_endpoint
      - realm
      - routing_table
      - routing_table_name
      - secret
      - transport
      - transport_name
      - username
    StrategyEnum:
      enum:
      - ringall
      - leastrecent
      - fewestcalls
      - random
      - rrmemory
      - rrordered
      - linear
      - wrandom
      type: string
      description: |-
        * `ringall` - Ring All
        * `leastrecent` - Least Recent
        * `fewestcalls` - Fewest Calls
        * `random` - Random
        * `rrmemory` - Round Robin Memory
        * `rrordered` - Round Robin Ordered
        * `linear` - Linear as configured
        * `wrandom` - Weighted Random
    TelephoneTypeEnum:
      enum:
      - spa502g
      - spa504g
      - gxp1200
      - softphone
      - webrtc
      - other
      type: string
      description: |-
        * `spa502g` - Cisco SPA502G
        * `spa504g` - Cisco SPA504G
        * `gxp1200` - Grandstream GXP1200
        * `softphone` - Softphone
        * `webrtc` - WebRTC
        * `other` - Other
    TimeoutpriorityEnum:
      enum:
      - app
      - conf
      type: string
      description: |-
        * `app` - Application
        * `conf` - Configuration
    TrunkGroup:
      type: object
      description: |-
        A trunk group (failover set of SIPPeers). `name` is looked up by
        services/fastagi/fastagi.py via raw SQL from a literal
        `dial-trunk-group,<name>,` AGI call embedded in dialplan text, so renaming
        or deleting a group still referenced there is rejected.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Trunk Group Name
          description: Name of the trunk group
          maxLength: 64
        sip_peers:
          type: array
          items:
            type: integer
        sip_peer_names:
          type: array
          items:
            type: string
            title: Channel name
            description: Name of the channel
          readOnly: true
        sip_peers_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - created_by
      - id
      - modified_at
      - modified_by
      - name
      - sip_peer_names
      - sip_peers_count
    Whitelist:
      type: object
      description: Shared base for Blacklist/Whitelist (identical fields).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Caller ID
          description: Caller ID to allow
          maxLength: 64
        destination:
          type: string
          default: ''
          description: Destination number where calls must be allowed. Default= for
            whole system allowing.
          maxLength: 64
        reason:
          type: string
          default: ''
          description: Reason for allowing the caller ID
          maxLength: 64
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: Expiration date for the whitelist entry. If not set, the entry
            is permanent.
      required:
      - callerid
      - id
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Token"
