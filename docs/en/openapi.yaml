        schema:
          type: string
          format: uuid
        description: A UUID string identifying this custom list names.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - lists
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCustomListEntryList'
          description: ''
    post:
      operationId: lists_entries_create
      description: Set created_by / modified_by from the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this custom list names.
        required: true
      tags:
