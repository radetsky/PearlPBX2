      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this sip user.
        required: true
      tags:
      - sip-users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIPUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SIPUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SIPUser'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPUser'
          description: ''
        '400':
          description: Invalid request body.
    patch:
      operationId: sip_users_partial_update
      description: |-
        SIP extensions (accounts).

        Every method requires a staff or superuser account — this resource exposes
        dial-out credentials (plaintext `secret`, and `realm`/`md5_cred` for
        WebRTC/MD5 authentication).

        Saving here only updates the database; changes reach Asterisk after a
