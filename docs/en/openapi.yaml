      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this sip user.
        required: true
      tags:
      - sip-users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSIPUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedSIPUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSIPUser'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPUser'
          description: ''
        '400':
          description: Invalid request body.
    delete:
      operationId: sip_users_destroy
      description: |-
        SIP extensions (accounts).

        Every method requires a staff or superuser account — this resource exposes
        dial-out credentials (plaintext `secret`, and `realm`/`md5_cred` for
        WebRTC/MD5 authentication).

        Saving here only updates the database; changes reach Asterisk after a
        superuser runs "Apply Changes" in the admin. Deleting a SIP user cascades
        to any `PhoneDevice` provisioned for it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this sip user.
        required: true
      tags:
      - sip-users
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
