components:
  schemas:
    AnnounceHoldtimeEnum:
      enum:
      - 'yes'
      - 'no'
      - once
      type: string
      description: |-
        * `yes` - Yes
        * `no` - No
        * `once` - Once
    AnnouncePositionEnum:
      enum:
      - 'yes'
      - 'no'
      - more
      - limit
      type: string
      description: |-
        * `yes` - Yes
        * `no` - No
        * `more` - More
        * `limit` - Limit
    AnnounceRoundSecondsEnum:
      enum:
      - 0
      - 5
      - 10
      - 15
      - 20
      - 25
      - 30
      type: integer
      description: |-
        * `0` - 0
        * `5` - 5
        * `10` - 10
        * `15` - 15
        * `20` - 20
        * `25` - 25
        * `30` - 30
    ApplyChanges:
      type: object
      description: |-
        Required, no implicit default — unlike the admin form, where anything
        other than the literal string "soft" silently means a hard restart.
      properties:
        mode:
          allOf:
          - $ref: '#/components/schemas/ModeEnum'
          description: |-
            'soft': module/AEL reload, keeps active calls. 'hard': 'core restart now', drops every active call.

            * `soft` - soft
            * `hard` - hard
      required:
      - mode
    AuthTypeEnum:
      enum:
      - userpass
      - md5
      type: string
      description: |-
        * `userpass` - Plaintext
        * `md5` - MD5
    AutopauseEnum:
      enum:
      - 'yes'
      - 'no'
      - all
      type: string
      description: |-
        * `yes` - Yes
        * `no` - No
        * `all` - All
    Blacklist:
      type: object
      description: Shared base for Blacklist/Whitelist (identical fields).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Caller ID
          description: Caller ID to block
          maxLength: 64
        destination:
          type: string
          default: ''
          description: Destination number where calls must be blocked. Default= for
            whole system blocking.
          maxLength: 64
        reason:
          type: string
          default: ''
          description: Reason for blocking the caller ID
          maxLength: 64
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: Expiration date for the blacklist entry. If not set, the entry
            is permanent.
      required:
      - callerid
      - id
    BlankEnum:
      enum:
      - ''
    Conference:
      type: object
      description: Fields shared by every endpoint that originates one or more AMI
        calls.
      properties:
        callerid:
          type: string
          description: Caller ID applied to the call, format 'name<number>', e.g.
            '380443333333<0675653380>'.
          maxLength: 128
        timeout_ms:
          type: integer
          maximum: 120000
          minimum: 1000
          default: 30000
          description: Max time to wait for the call to answer, in milliseconds.
        parties:
          type: array
          items:
            type: string
            maxLength: 256
          description: Channels to originate into the same conference room, e.g. ["PJSIP/101",
            "PJSIP/0504139380@mega-provider", "Local/2222@internal"].
          minItems: 2
        room:
          type: string
          description: Conference room number. If omitted, a new one is generated
            and returned in the response.
          maxLength: 64
        context:
          type: string
          description: Dialplan context that lands each leg into ConfBridge. Defaults
            to settings.PEARLPBX_CONFERENCE_CONTEXT.
          maxLength: 128
      required:
      - parties
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Caller ID
          description: Caller ID to recognize
          maxLength: 64
        name:
          type: string
          description: Name of the caller ID
          maxLength: 64
      required:
      - callerid
      - id
      - name
    CustomListEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Custom List Entry Value
          description: Value of the custom list entry
          maxLength: 64
        destination:
          type: string
          default: ''
          description: Destination number where calls must be detected. Default= for
            whole system detection.
          maxLength: 64
        reason:
          type: string
          default: ''
          description: Reason for detecting the caller ID
          maxLength: 64
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: Expiration date for the custom list entry. If not set, the
            entry is permanent.
      required:
      - callerid
      - id
    CustomListName:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Custom List Name
          description: Name of the custom list
          maxLength: 64
      required:
      - id
      - name
    MethodEnum:
      enum:
      - default
      - tlsv1
      - tlsv1_1
      - tlsv1_2
      - sslv2
      - sslv3
      - sslv23
      type: string
      description: |-
        * `default` - The default as defined by PJSIP. This is currently TLSv1
        * `tlsv1` - TLSv1
        * `tlsv1_1` - TLSv1.1
        * `tlsv1_2` - TLSv1.2
        * `sslv2` - SSLv2
        * `sslv3` - SSLv3
        * `sslv23` - SSLv2.3
    ModeEnum:
      enum:
      - soft
      - hard
      type: string
      description: |-
        * `soft` - soft
        * `hard` - hard
    MonitorFormatEnum:
      enum:
      - wav
      - gsm
      - wav49
      type: string
      description: |-
        * `wav` - WAV
        * `gsm` - GSM
        * `wav49` - WAV49
    NullEnum:
      enum:
      - null
    Originate:
      type: object
      description: Fields shared by every endpoint that originates one or more AMI
        calls.
      properties:
        callerid:
          type: string
          description: Caller ID applied to the call, format 'name<number>', e.g.
            '380443333333<0675653380>'.
          maxLength: 128
        timeout_ms:
          type: integer
          maximum: 120000
          minimum: 1000
          default: 30000
          description: Max time to wait for the call to answer, in milliseconds.
        channel:
          type: string
          description: First leg to dial, e.g. 'Local/0503856087@default' or 'PJSIP/101'.
          maxLength: 256
        exten:
          type: string
          description: Extension/number the first leg is connected to, e.g. '0675653380'.
          maxLength: 128
        context:
          type: string
          default: default
          description: Dialplan context. Defaults to 'default'.
          maxLength: 128
        priority:
          type: integer
          minimum: 1
          default: 1
          description: Dialplan priority.
        variable:
          type: object
          additionalProperties:
            type: string
          description: 'Channel variables, e.g. {"userId": "0"}.'
      required:
      - channel
      - exten
