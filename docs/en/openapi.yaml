openapi: 3.0.3
info:
  title: PearlPBX2 API
  version: 1.0.0
  description: REST API for PearlPBX2 — blacklist, whitelist, contacts, custom lists,
    call origination, and call recordings.
paths:
  /api/v1/blacklist/:
    get:
      operationId: blacklist_list
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - blacklist
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlacklistList'
          description: ''
    post:
      operationId: blacklist_create
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      tags:
      - blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Blacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Blacklist'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '400':
          description: Invalid request body.
        '409':
          description: Uniqueness constraint would be violated.
  /api/v1/blacklist/{id}/:
    get:
      operationId: blacklist_retrieve
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blacklist.
        required: true
      tags:
      - blacklist
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
    put:
      operationId: blacklist_update
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blacklist.
        required: true
      tags:
      - blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Blacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Blacklist'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '400':
          description: Invalid request body.
        '409':
          description: Uniqueness constraint would be violated.
    patch:
      operationId: blacklist_partial_update
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blacklist.
        required: true
      tags:
      - blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBlacklist'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '400':
          description: Invalid request body.
        '409':
          description: Uniqueness constraint would be violated.
    delete:
      operationId: blacklist_destroy
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blacklist.
        required: true
      tags:
      - blacklist
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calls/conference/:
    post:
      operationId: calls_conference_create
      summary: Originate several parties into a shared ConfBridge conference room
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Conference'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Conference'
        required: true
      security:
      - tokenAuth: []
      responses:
        '202':
          description: Conference legs queued (see per-party results).
        '400':
          description: Invalid request body.
        '401':
          description: Authentication credentials were not provided.
        '502':
          description: AMI error or Asterisk unreachable.
        '503':
          description: Asterisk is disabled in this DEVMODE.
  /api/v1/calls/originate/:
    post:
      operationId: calls_originate_create
      summary: Originate a call
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Originate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Originate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Originate'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Call originated successfully.
        '400':
          description: Invalid request body.
        '401':
          description: Authentication credentials were not provided.
        '502':
          description: AMI error or Asterisk unreachable.
        '503':
          description: Asterisk is disabled in this DEVMODE.
  /api/v1/contacts/:
    get:
      operationId: contacts_list
      description: |-
