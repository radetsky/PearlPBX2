          title: Custom List Name
          description: Name of the custom list
          maxLength: 64
    PatchedPhoneDevice:
      type: object
      description: |-
        A provisioned phone (or softphone/WebRTC client). Saving here only
        updates the database — a config file is written to the TFTP directory
        only via the `provision` action, or the admin's "Apply configurations"
        action.

        `sip_user` is optional: a device with none assigned is a normal,
        not-yet-configured state (see PhoneDeviceAdmin's "No SIP User" status).
      properties:
        id:
          type: integer
          readOnly: true
        telephone_type:
          allOf:
          - $ref: '#/components/schemas/TelephoneTypeEnum'
          description: |-
            Type of telephone device

            * `spa502g` - Cisco SPA502G
            * `spa504g` - Cisco SPA504G
            * `gxp1200` - Grandstream GXP1200
            * `softphone` - Softphone
            * `webrtc` - WebRTC
            * `other` - Other
        mac_address:
          type: string
          maxLength: 17
        sip_user:
          type: integer
          nullable: true
          description: SIP user associated with this device
        sip_user_username:
          type: string
          nullable: true
          readOnly: true
        sip_server:
          type: string
          description: SIP server address
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        created_by:
          type: integer
          readOnly: true
          nullable: true
        modified_at:
          type: string
          format: date-time
          readOnly: true
        modified_by:
          type: integer
          readOnly: true
          nullable: true
    PatchedQueue:
      type: object
      description: |-
        A call queue (app_queue). `name` is looked up by Asterisk's app_queue
        from a literal `Queue(<name>,...)` AEL app-call embedded in dialplan
        text, so renaming or deleting a queue still referenced there is
        rejected (see Queue.find_dialplan_references()).

        Saving here only updates the database; changes reach Asterisk after a
        superuser runs "Apply Changes" in the admin.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Queue Name
          maxLength: 64
        music_class:
          type: integer
          title: Music on hold
        music_class_name:
          type: string
          readOnly: true
        announce:
          type: string
          nullable: true
          title: Announcement to the member
          description: |-
            An announcement may be specified which is played for the member as
            soon as they answer a call, typically to indicate to them which queue
            this call should be answered as, so that agents or members who are
            listening to more than one queue can differentiated how they should
            engage the customer
          maxLength: 64
        queue_announce:
          type: string
          nullable: true
          title: Queue announcement to the caller
          description: |-
            An announcement may be specified which is played to the caller just
            before they are bridged with an agent.
          maxLength: 64
        strategy:
          $ref: '#/components/schemas/StrategyEnum'
        service_level:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        context:
          type: string
          nullable: true
          description: |-
            If a 'context' is specified, and a caller enters an extension that
            matches an extension within that context, they will be taken out of
            the queue and sent to that extension.
          maxLength: 64
        maxlen:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Maximum Queue Length
        timeout:
          type: integer
          maximum: 2147483647
          minimum: 0
        retry:
          type: integer
          maximum: 2147483647
          minimum: 0
        timeoutpriority:
          allOf:
          - $ref: '#/components/schemas/TimeoutpriorityEnum'
          title: Timeout Priority
        weight:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Queue Weight
        wrapuptime:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Wrap-Up Time
        autofill:
          type: boolean
        autopause:
          $ref: '#/components/schemas/AutopauseEnum'
        autopausedelay:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Autopause Delay
        reportholdtime:
          type: boolean
          title: Report Hold Time
        setinterfacevar:
          type: boolean
          title: Set Interface Variable
        setqueueentryvar:
          type: boolean
          title: Set Queue Entry Variable
        setqueuevar:
          type: boolean
          title: Set Queue Variable
        announce_frequency:
          type: integer
          maximum: 2147483647
          minimum: 0
        min_announce_frequency:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Minimum Announce Frequency
        periodic_announce_frequency:
