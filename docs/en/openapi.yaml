openapi: 3.0.3
info:
  title: PearlPBX2 API
  version: 1.0.0
  description: REST API for PearlPBX2 — blacklist, whitelist, contacts, custom lists,
    call origination, and call recordings.
paths:
  /api/v1/blacklist/:
    get:
      operationId: blacklist_list
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - blacklist
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBlacklistList'
          description: ''
    post:
      operationId: blacklist_create
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      tags:
      - blacklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Blacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Blacklist'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '400':
          description: Invalid request body.
        '409':
          description: Uniqueness constraint would be violated.
  /api/v1/blacklist/{id}/:
    get:
      operationId: blacklist_retrieve
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blacklist.
        required: true
      tags:
      - blacklist
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
