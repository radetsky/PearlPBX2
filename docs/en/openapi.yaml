          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomListName'
          description: ''
    put:
      operationId: lists_update
      description: Set created_by / modified_by from the authenticated user.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this custom list names.
