          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBlacklist'
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blacklist'
          description: ''
        '400':
          description: Invalid request body.
        '409':
          description: Uniqueness constraint would be violated.
    delete:
      operationId: blacklist_destroy
      description: |-
        POST performs update_or_create; 201 on create, 200 on update.

        Subclass sets `upsert_lookup_fields` (used as the lookup) — the rest of the
        validated data becomes `defaults`.
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this blacklist.
        required: true
      tags:
      - blacklist
      security:
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/calls/conference/:
    post:
      operationId: calls_conference_create
      summary: Originate several parties into a shared ConfBridge conference room
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conference'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Conference'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Conference'
        required: true
      security:
      - tokenAuth: []
      responses:
        '202':
          description: Conference legs queued (see per-party results).
        '400':
          description: Invalid request body.
        '401':
          description: Authentication credentials were not provided.
        '502':
          description: AMI error or Asterisk unreachable.
        '503':
          description: Asterisk is disabled in this DEVMODE.
  /api/v1/calls/originate/:
    post:
      operationId: calls_originate_create
      summary: Originate a call
      tags:
      - calls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Originate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Originate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Originate'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Call originated successfully.
        '400':
          description: Invalid request body.
        '401':
          description: Authentication credentials were not provided.
        '502':
          description: AMI error or Asterisk unreachable.
        '503':
          description: Asterisk is disabled in this DEVMODE.
  /api/v1/config/apply/:
    post:
      operationId: config_apply_create
      description: |-
        Write configs (with backup) and reload Asterisk. Superuser only.

        mode=soft -> module/AEL reload (keeps active calls).
        mode=hard -> 'core restart now' (drops every active call).
      summary: Apply generated configs and reload Asterisk
      tags:
      - config
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyChanges'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApplyChanges'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApplyChanges'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Configs applied.
        '400':
          description: Invalid request body.
        '409':
          description: Another apply is already in progress.
        '500':
          description: Applying the configuration failed.
  /api/v1/config/preview/:
    get:
      operationId: config_preview_retrieve
      description: |-
        GET-only dry-run: same content as the admin's GET preview, no
        filesystem writes, no AMI. Superuser only.
      summary: Preview generated Asterisk config files (dry-run)
      tags:
      - config
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Generated config file contents.
