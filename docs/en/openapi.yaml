components:
  schemas:
    Blacklist:
      type: object
      description: Shared base for Blacklist/Whitelist (identical fields).
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Ідентифікатор абонента
          description: Ідентифікатор абонента для блокування
          maxLength: 64
        destination:
          type: string
          default: ''
          title: Призначення
          description: Номер призначення, де дзвінки повинні блокуватися. Порожнє
            = блокування для всієї системи.
          maxLength: 64
        reason:
          type: string
          default: ''
          title: Причина
          description: Причина блокування ідентифікатора абонента
          maxLength: 64
        expiration_date:
          type: string
          format: date-time
          nullable: true
          title: Дата закінчення
          description: Дата закінчення терміну дії запису чорного списку. Якщо не
            вказано — запис постійний.
      required:
      - callerid
      - id
    Contact:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Ідентифікатор абонента
          description: Ідентифікатор абонента для розпізнавання
          maxLength: 64
        name:
          type: string
          title: Назва
          description: Ім'я ідентифікатора абонента
          maxLength: 64
      required:
      - callerid
      - id
      - name
    CustomListEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        callerid:
          type: string
          title: Custom List Entry Value
          description: Value of the custom list entry
          maxLength: 64
        destination:
          type: string
          default: ''
          description: Destination number where calls must be detected. Default= for
            whole system detection.
          maxLength: 64
        reason:
          type: string
          default: ''
          description: Reason for detecting the caller ID
          maxLength: 64
        expiration_date:
          type: string
          format: date-time
          nullable: true
          description: Expiration date for the custom list entry. If not set, the
            entry is permanent.
      required:
      - callerid
      - id
    CustomListName:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          title: Custom List Name
          description: Name of the custom list
          maxLength: 64
      required:
      - id
      - name
    Originate:
      type: object
      properties:
        channel:
          type: string
          description: First leg to dial, e.g. 'Local/0503856087@default' or 'PJSIP/101'.
          maxLength: 256
        exten:
          type: string
          description: Extension/number the first leg is connected to, e.g. '0675653380'.
          maxLength: 128
        context:
          type: string
          default: default
          description: Dialplan context. Defaults to 'default'.
          maxLength: 128
        priority:
          type: integer
          minimum: 1
          default: 1
          description: Dialplan priority.
        callerid:
          type: string
          description: Caller ID, format 'name<number>', e.g. '380443333333<0675653380>'.
          maxLength: 128
        variable:
          type: object
          additionalProperties:
            type: string
          description: 'Channel variables, e.g. {"userId": "0"}.'
        timeout_ms:
          type: integer
          maximum: 120000
          minimum: 1000
          default: 30000
          description: Max time to wait for the originate in milliseconds.
      required:
      - channel
      - exten
