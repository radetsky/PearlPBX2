          description: ''
  /api/v1/lists/{id}/entries/{entry_pk}/:
    delete:
      operationId: lists_entries_destroy
      description: Delete a single entry scoped to its parent list.
      parameters:
      - in: path
        name: entry_pk
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - lists
      security:
      - tokenAuth: []
      responses:
        '204':
          description: Entry deleted
  /api/v1/queues/members/:
    get:
      operationId: queues_members_retrieve
      summary: List queue members and their current status
      parameters:
      - in: query
        name: queue
        schema:
          type: string
        description: Limit results to one queue. Omit to list members of every queue.
      tags:
      - queues
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueMemberList'
          description: ''
        '401':
          description: Authentication credentials were not provided.
        '502':
          description: AMI error or Asterisk unreachable.
        '503':
          description: Asterisk is disabled in this DEVMODE.
  /api/v1/queues/members/pause/:
    post:
      operationId: queues_members_pause_create
      summary: Pause or unpause a queue member
      tags:
      - queues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueMemberPause'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/QueueMemberPause'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/QueueMemberPause'
        required: true
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Pause state updated.
        '400':
          description: Invalid request body.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: Interface not found in the queue(s).
        '502':
          description: AMI error or Asterisk unreachable.
        '503':
          description: Asterisk is disabled in this DEVMODE.
  /api/v1/recordings/{uniqueid}/:
    get:
      operationId: recordings_retrieve
      description: Returns the recorded call audio for the given Asterisk uniqueid.
        The URL is deterministic and is delivered to CRM systems in webhook payloads
        as recording_url.
      summary: Fetch a call recording by Asterisk uniqueid
      parameters:
      - in: path
        name: uniqueid
        schema:
          type: string
        required: true
      tags:
      - recordings
      security:
      - tokenAuth: []
      responses:
        '200':
          description: The recording audio file (wav or mp3). Supports Range requests.
        '401':
          description: Authentication credentials were not provided.
        '404':
          description: No recording exists for this uniqueid.
  /api/v1/sip-users/:
    get:
      operationId: sip_users_list
      description: |-
        SIP extensions (accounts).

        Every method requires a staff or superuser account — this resource exposes
        dial-out credentials (plaintext `secret`, and `realm`/`md5_cred` for
        WebRTC/MD5 authentication).

        Saving here only updates the database; changes reach Asterisk after a
        superuser runs "Apply Changes" in the admin. Deleting a SIP user cascades
        to any `PhoneDevice` provisioned for it.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - sip-users
      security:
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSIPUserList'
          description: ''
    post:
      operationId: sip_users_create
      description: |-
        SIP extensions (accounts).

        Every method requires a staff or superuser account — this resource exposes
        dial-out credentials (plaintext `secret`, and `realm`/`md5_cred` for
        WebRTC/MD5 authentication).

        Saving here only updates the database; changes reach Asterisk after a
        superuser runs "Apply Changes" in the admin. Deleting a SIP user cascades
        to any `PhoneDevice` provisioned for it.
      tags:
      - sip-users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SIPUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SIPUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SIPUser'
        required: true
      security:
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SIPUser'
          description: ''
        '400':
          description: Invalid request body.
  /api/v1/sip-users/{id}/:
    get:
      operationId: sip_users_retrieve
      description: |-
        SIP extensions (accounts).

        Every method requires a staff or superuser account — this resource exposes
